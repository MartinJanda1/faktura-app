# Faktura-app — web + PostgreSQL pro QNAP Container Station / Docker
#
# Spuštění:
#   docker compose up -d --build
#
# Aplikace: http://IP_NAS:3000
#
# Pokud už máš postgres kontejner (postgres-1), použij místo toho:
#   docker compose -f docker-compose.app-only.yml up -d --build

services:
    postgres:
        image: postgres:16
        container_name: faktura-postgres
        restart: unless-stopped
        ports:
            - '5433:5432'
        environment:
            POSTGRES_USER: ${PG_USER:-cbos}
            POSTGRES_PASSWORD: ${PG_PASSWORD:-cbos}
            POSTGRES_DB: ${PG_DATABASE:-fakturaApp}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${PG_USER:-cbos} -d ${PG_DATABASE:-fakturaApp}']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    faktura:
        build: .
        container_name: faktura-app
        restart: unless-stopped
        ports:
            - '${APP_PORT:-3000}:3000'
        environment:
            CONNECTION_TO_PG: 'true'
            PG_HOST: postgres
            PGPORT: '5432'
            PG_DATABASE: ${PG_DATABASE:-fakturaApp}
            PG_USER: ${PG_USER:-cbos}
            PG_PASSWORD: ${PG_PASSWORD:-cbos}
            PORT: '3000'
            RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s

volumes:
    pgdata:
