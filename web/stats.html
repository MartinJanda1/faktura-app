<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Statistiky – MJ Faktura</title>
  <script>
    (function () {
      try {
        if (localStorage.getItem("faktura-theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/tailwind.css" />
</head>
<body class="m-0 flex min-h-screen flex-col bg-neutral-100 p-6 font-sans text-sm leading-snug text-neutral-900">
  <div class="mx-auto w-full max-w-5xl flex-1">
    <header class="mb-8 flex flex-wrap items-center justify-between gap-4">
      <div>
        <a href="index.html" class="text-sm text-brand hover:text-brand-dark hover:underline">← Zpět na seznam</a>
        <h1 class="mt-3 text-2xl font-bold text-neutral-900">Statistiky</h1>
        <p class="mt-1 text-neutral-600">Obrat, hodiny a odběratelé podle zvoleného období.</p>
      </div>
      <button type="button" id="theme-toggle" class="theme-toggle" role="switch" aria-checked="false"
        aria-label="Přepnout světlý a tmavý režim" title="Světlý / tmavý režim">
        <span class="theme-toggle-thumb">
          <span data-mdi="whiteBalanceSunny" data-mdi-class="theme-icon-sun"></span>
          <span data-mdi="moonWaningCrescent" data-mdi-class="theme-icon-moon"></span>
        </span>
      </button>
    </header>

    <p id="stats-error" class="mb-4 hidden rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"></p>

    <section class="mb-6 rounded-xl bg-white p-5 shadow-sm ring-1 ring-neutral-200">
      <div class="flex flex-wrap items-end gap-3">
        <div>
          <label for="stats-year" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-neutral-500">Rok</label>
          <select id="stats-year" class="filter-select filter-select-year"></select>
        </div>
        <div>
          <label for="stats-quarter" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-neutral-500">Kvartál</label>
          <select id="stats-quarter" class="filter-select min-w-[120px]" disabled>
            <option value="">Celý rok</option>
            <option value="1">Q1</option>
            <option value="2">Q2</option>
            <option value="3">Q3</option>
            <option value="4">Q4</option>
          </select>
        </div>
        <div>
          <label for="stats-month" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-neutral-500">Měsíc</label>
          <select id="stats-month" class="filter-select filter-select-month" disabled></select>
        </div>
        <div>
          <label for="stats-customer" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-neutral-500">Odběratel</label>
          <select id="stats-customer" class="filter-select min-w-[180px]"></select>
        </div>
        <div>
          <label for="stats-status" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-neutral-500">Stav</label>
          <select id="stats-status" class="filter-select min-w-[140px]">
            <option value="all">Všechny</option>
            <option value="active">Platné</option>
            <option value="resolved">Vyřízené</option>
            <option value="cancelled">Stornované</option>
          </select>
        </div>
        <button type="button" id="stats-reset" class="btn-secondary">Reset filtru</button>
      </div>
      <p id="stats-result-count" class="mt-3 text-xs text-neutral-500"></p>
    </section>

    <section class="mb-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
      <div class="stats-kpi rounded-xl bg-white p-4 shadow-sm ring-1 ring-neutral-200">
        <p class="text-xs font-semibold uppercase tracking-wide text-neutral-500">Faktur</p>
        <p id="kpi-count" class="mt-2 text-2xl font-bold tabular-nums text-neutral-900">0</p>
        <p id="kpi-status" class="mt-1 text-xs text-neutral-500">—</p>
      </div>
      <div class="stats-kpi rounded-xl bg-white p-4 shadow-sm ring-1 ring-neutral-200">
        <p class="text-xs font-semibold uppercase tracking-wide text-neutral-500">Obrat</p>
        <p id="kpi-total" class="mt-2 text-2xl font-bold tabular-nums text-neutral-900">0 Kč</p>
      </div>
      <div class="stats-kpi rounded-xl bg-white p-4 shadow-sm ring-1 ring-neutral-200">
        <p class="text-xs font-semibold uppercase tracking-wide text-neutral-500">Hodiny</p>
        <p id="kpi-hours" class="mt-2 text-2xl font-bold tabular-nums text-neutral-900">0 h</p>
      </div>
      <div class="stats-kpi rounded-xl bg-white p-4 shadow-sm ring-1 ring-neutral-200">
        <p class="text-xs font-semibold uppercase tracking-wide text-neutral-500">Průměr / faktura</p>
        <p id="kpi-avg" class="mt-2 text-2xl font-bold tabular-nums text-neutral-900">—</p>
      </div>
    </section>

    <section class="mb-6 grid gap-6 lg:grid-cols-5">
      <div class="rounded-xl bg-white p-5 shadow-sm ring-1 ring-neutral-200 lg:col-span-3">
        <h2 id="chart-revenue-title" class="mb-4 text-sm font-bold text-neutral-900">Obrat</h2>
        <div class="stats-chart-wrap relative h-72">
          <canvas id="chart-revenue" aria-label="Graf obratu"></canvas>
        </div>
      </div>
      <div class="rounded-xl bg-white p-5 shadow-sm ring-1 ring-neutral-200 lg:col-span-2">
        <h2 class="mb-4 text-sm font-bold text-neutral-900">Podíl odběratelů</h2>
        <div class="stats-chart-wrap relative h-72">
          <canvas id="chart-customers" aria-label="Graf odběratelů"></canvas>
          <p id="chart-customers-empty" class="absolute inset-0 hidden flex items-center justify-center text-sm text-neutral-500">
            Žádná data
          </p>
        </div>
      </div>
    </section>

    <section class="mb-6 overflow-hidden rounded-xl bg-white shadow-sm ring-1 ring-neutral-200">
      <div class="border-b border-neutral-200 px-5 py-3">
        <h2 class="text-sm font-bold text-neutral-900">Detail období</h2>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full min-w-[480px] text-left">
          <thead>
            <tr class="border-b border-neutral-200 bg-neutral-50 text-xs uppercase tracking-wide text-neutral-500">
              <th class="px-4 py-3 font-semibold">Období</th>
              <th class="px-4 py-3 text-right font-semibold">Faktur</th>
              <th class="px-4 py-3 text-right font-semibold">Hodin</th>
              <th class="px-4 py-3 text-right font-semibold">Obrat</th>
            </tr>
          </thead>
          <tbody id="stats-table-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <footer class="app-footer mt-10 border-t border-neutral-200 pt-4">
    <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3 text-xs text-neutral-500">
      <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
        <span>© <span data-app-year></span> MJ Faktura</span>
        <span class="text-neutral-300" aria-hidden="true">·</span>
        <a href="stats.html" class="text-brand hover:text-brand-dark hover:underline">Statistiky</a>
        <span class="text-neutral-300" aria-hidden="true">·</span>
        <a href="help.html" class="text-brand hover:text-brand-dark hover:underline">Nápověda</a>
      </div>
      <span data-app-version></span>
    </div>
  </footer>

  <script src="js/vendor/chart.umd.min.js"></script>
  <script src="js/app-meta.js"></script>
  <script src="js/mdi-icons.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/invoice-model.js"></script>
  <script src="js/invoice-filters.js"></script>
  <script src="js/invoice-stats.js"></script>
  <script src="app-stats.js"></script>
</body>
</html>
